<!-- NORTH STAR v0.3.7 -->
<!DOCTYPE html>
<html>
<head>
  <title>North Star</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="North Star">
  <meta name="theme-color" content="#050505">

<style>
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.app{height:100vh;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.topbar{height:70px;display:grid;grid-template-columns:1fr 420px 1fr;align-items:flex-start;font-weight:800}
.brand{font-size:16px;text-transform:lowercase}
.label,.meta,.view-title{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.meta{text-align:right;line-height:1.35}
.meter{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
#meterLabel{font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.8}
#meterGrid{display:grid;gap:2px;justify-content:center;max-width:420px}
.meter-square{width:6px;height:6px;border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.08)}
.meter-square.filled{background:#eee;border-color:#eee}
.meter-square.current{background:#eee;border-color:#eee;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
#meterSub{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.62}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.view-title{text-align:right;margin-left:auto;white-space:nowrap}
button{background:#0d0f12;color:#eee;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(0,0,0,.65)}
button:hover{background:#15181c;border-color:rgba(255,255,255,.38)}
.grid-wrap{flex:1;overflow:auto;background:#08090a;scroll-behavior:auto}
.grid{display:grid;min-height:100%;border-top:2px solid rgba(255,255,255,.55);border-left:2px solid rgba(255,255,255,.55)}
.tile{position:relative;min-height:118px;border-right:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.55);background:#14171b;padding:7px 8px;overflow:visible;cursor:pointer}
.tile:nth-child(even){background:#111418}
.tile.has-photo{background:linear-gradient(135deg,#20242b,#0d0f12)}
.tile.has-photo::marker{display:none}
.tile.has-photo .photo-dot{position:absolute;right:8px;bottom:8px;width:8px;height:8px;background:#eee}
.tile.current{outline:4px solid #eee;outline-offset:-4px;background:#20242b;z-index:4}
.tile.future{opacity:.38}.tile.past{opacity:.82}
.tile::before,.tile::after{content:"";position:absolute;background:#eee;z-index:50;pointer-events:none;opacity:1}
.tile::before{width:10px;height:2px;right:-6px;bottom:-2px}
.tile::after{width:2px;height:10px;right:-2px;bottom:-6px}
.tile-text{font-size:10px;font-weight:900;line-height:1.08;letter-spacing:.45px;text-transform:uppercase}
.empty{background:#070707;opacity:.18;cursor:default}
.empty::before,.empty::after{content:none}

.panel{
  position:fixed;
  right:22px;
  bottom:22px;
  width:340px;
  background:#090a0c;
  border:2px solid rgba(255,255,255,.55);
  padding:14px;
  z-index:200;
  display:none;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
}

.panel.active{display:block}

.panel-title{
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:10px;
}

.panel-meta{
  font-size:10px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
  opacity:.65;
  line-height:1.45;
  margin-bottom:10px;
}

textarea{
  width:100%;
  height:110px;
  background:#050505;
  color:#eee;
  border:1px solid rgba(255,255,255,.25);
  padding:10px;
  font-size:12px;
  font-weight:800;
  resize:none;
  outline:none;
}

.panel-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="brand">north star</div>
      <div class="label" id="viewLabel"></div>
    </div>

    <div class="meter">
      <div id="meterLabel"></div>
      <div id="meterGrid"></div>
      <div id="meterSub"></div>
    </div>

    <div class="meta" id="lifeMeta"></div>
  </div>

  <div class="nav-row">
    <div class="nav">
      <button onclick="render('years')">Years</button>
      <button onclick="render('months')">Months</button>
      <button onclick="render('weeks')">Weeks</button>
      <button onclick="render('days')">Days</button>
      <button onclick="goBack()">Back</button>
    </div>
    <div class="view-title" id="currentView"></div>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div id="grid" class="grid"></div>
  </div>

</div>

<div class="panel" id="dayPanel">
  <div class="panel-title" id="panelTitle"></div>
  <div class="panel-meta" id="panelMeta"></div>
  <textarea id="dayNote" placeholder="DAY NOTE"></textarea>
  <div class="panel-actions">
    <button onclick="togglePhotoMarker()">Photo Marker</button>
    <button onclick="closePanel()">Close</button>
  </div>
</div>

<script>
const APP_VERSION = "0.3.7";
const BIRTH = new Date(1987,5,26);
const HORIZON_YEARS = 110;
const END = new Date(2097,5,26);
const MS_DAY = 86400000;
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

let historyStack = [];
let currentRender = {mode:"years", data:null};
let selectedDay = null;

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayNum(d){return Math.floor((sod(d)-sod(BIRTH))/MS_DAY)+1}
function ageYears(d=new Date()){return (d-BIRTH)/(MS_DAY*365.2425)}
function yearNum(y){return y-BIRTH.getFullYear()}
function monthNum(y,m){return (y-BIRTH.getFullYear())*12+m+1}
function weekNumFromStart(d){return Math.floor((sod(d)-sod(BIRTH))/(MS_DAY*7))+1}
function totalWeeks(){return weekNumFromStart(addDays(END,-1))}
function clampDate(d){if(d<BIRTH)return new Date(BIRTH);if(d>=END)return new Date(END);return d}
function formatMonthDay(d){return `${MONTHS[d.getMonth()]} ${d.getDate()}`}
function formatWeekRange(start){const end=addDays(start,6);return start.getMonth()===end.getMonth()?`${MONTHS[start.getMonth()]} ${start.getDate()}—${end.getDate()}`:`${MONTHS[start.getMonth()]} ${start.getDate()}—${MONTHS[end.getMonth()]} ${end.getDate()}`}
function dayOfYear(d){const start=new Date(d.getFullYear(),0,1);return Math.floor((sod(d)-sod(start))/MS_DAY)+1}
function daysInYear(y){return new Date(y,1,29).getMonth()===1?366:365}
function weekOfYearApprox(d){return Math.floor((dayOfYear(d)-1)/7)+1}
function weeksInCurrentYear(){return Math.ceil(daysInYear(new Date().getFullYear())/7)}
function daysLeftInYear(){const now=sod(new Date());const last=new Date(now.getFullYear(),11,31);return Math.floor((sod(last)-now)/MS_DAY)}
function dayKey(d){return `ns_day_${dayNum(d)}`}
function hasPhotoMarker(d){return localStorage.getItem(dayKey(d)+"_photo")==="1"}

function meta(){
  const now=new Date();
  const days=dayNum(now);
  const total=Math.floor(365.2425*HORIZON_YEARS);
  lifeMeta.innerHTML=`DAY ${days.toLocaleString()}<br>AGE ${ageYears(now).toFixed(2)}<br>${((days/total)*100).toFixed(2)}% TO 110<br><span style="opacity:.55">VER ${APP_VERSION}</span>`;
}

function updateMeter(mode){
  const now=new Date();
  let total=111,current=yearNum(now.getFullYear())+1,label=`CURRENT YEAR: ${yearNum(now.getFullYear())}`,sub="";
  if(mode==="months"||mode==="yearMonths"||mode==="monthWeeks"){total=12;current=now.getMonth()+1;label=`CURRENT MONTH: ${monthNum(now.getFullYear(),now.getMonth())}`;sub=`MONTH ${current} OF 12`}
  if(mode==="weeks"||mode==="weekDays"){total=weeksInCurrentYear();current=weekOfYearApprox(now);label=`CURRENT WEEK: ${weekNumFromStart(now)}`;sub=`WEEK ${current} OF ${total}`}
  if(mode==="days"){total=daysInYear(now.getFullYear());current=dayOfYear(now);label=`CURRENT DAY: ${dayNum(now)}`;sub=`DAYS LEFT: ${daysLeftInYear()}`}
  if(mode==="years"){sub=`YEAR ${yearNum(now.getFullYear())} OF 110`}
  meterLabel.innerText=label;meterSub.innerText=sub;meterGrid.innerHTML="";
  let cols=total;if(total>60)cols=37;if(total<=12)cols=total;if(total>12&&total<=60)cols=26;
  meterGrid.style.gridTemplateColumns=`repeat(${cols}, 6px)`;
  for(let i=1;i<=total;i++){const sq=document.createElement("div");sq.className="meter-square";if(i<current)sq.classList.add("filled");if(i===current)sq.classList.add("current");meterGrid.appendChild(sq)}
}

function setState(label,title,cols){
  viewLabel.innerText=label;
  currentView.innerText=title;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.innerHTML="";
  gridWrap.scrollTop=0;
  updateMeter(currentRender.mode);
}

function clsForDate(d){
  const now=sod(new Date());
  let cls=+sod(d)===+now?"current":d<now?"past":"future";
  if(hasPhotoMarker(d))cls+=" has-photo";
  return cls;
}

function tile(lines,cls,onClick,id,dateObj=null){
  const t=document.createElement("div");
  t.className="tile "+(cls||"");
  if(id)t.id=id;
  t.innerHTML=`<div class="tile-text">${lines.filter(Boolean).join("<br>")}</div>${dateObj&&hasPhotoMarker(dateObj)?'<div class="photo-dot"></div>':''}`;
  if(onClick)t.onclick=onClick;
  grid.appendChild(t);
}

function scrollToCurrent(){
  setTimeout(()=>{const cur=document.getElementById("currentTile");if(cur)gridWrap.scrollTop=Math.max(0,cur.offsetTop-180)},60);
}

function render(mode,data=null,push=true){
  if(push)historyStack.push({...currentRender});
  currentRender={mode,data};
  if(mode==="years")renderYears();
  if(mode==="months")renderMonths();
  if(mode==="weeks")renderWeeks();
  if(mode==="days")renderDays();
  if(mode==="yearMonths")renderYearMonths(data.year);
  if(mode==="monthWeeks")renderMonthWeeks(data.year,data.month);
  if(mode==="weekDays")renderWeekDays(data.start);
}

function renderYears(){
  setState("Lifetime Grid","1987 — 2097",8);
  const nowY=new Date().getFullYear();
  for(let y=1987;y<=2097;y++){
    const cls=y===nowY?"current":y<nowY?"past":"future";
    tile([`${y}`,`Y /// ${yearNum(y)}`,y===nowY?"CURRENT YEAR":""],cls,()=>render("yearMonths",{year:y}),y===nowY?"currentTile":null);
  }
  scrollToCurrent();
}

function renderYearMonths(y){
  setState("Year Grid",`${y} / Y /// ${yearNum(y)}`,4);
  const now=new Date();
  for(let m=0;m<12;m++){
    const d=new Date(y,m,1);
    const isCurrent=y===now.getFullYear()&&m===now.getMonth();
    tile([`${MONTHS[m]}`,`M /// ${monthNum(y,m)}`],clsForDate(d),()=>render("monthWeeks",{year:y,month:m}),isCurrent?"currentTile":null);
  }
  scrollToCurrent();
}

function renderMonths(){
  setState("Continuous Month Grid","M /// 1 — M /// 1320",6);
  const now=new Date();
  for(let y=1987;y<=2097;y++){
    for(let m=0;m<12;m++){
      const d=new Date(y,m,1);
      if(d>=END)break;
      const isCurrent=y===now.getFullYear()&&m===now.getMonth();
      tile([`${MONTHS[m]}`,`M /// ${monthNum(y,m)}`],clsForDate(d),()=>render("monthWeeks",{year:y,month:m}),isCurrent?"currentTile":null);
    }
  }
  scrollToCurrent();
}

function renderMonthWeeks(y,m){
  setState("Month Grid",`${MONTHS[m]} ${y}`,4);
  const now=sod(new Date());
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  let start=new Date(first);
  while(start<=last){
    const weekStart=new Date(start);
    const isCurrent=now>=weekStart&&now<=addDays(weekStart,6);
    tile([formatWeekRange(weekStart),`W /// ${weekNumFromStart(weekStart)}`],clsForDate(weekStart),()=>render("weekDays",{start:weekStart}),isCurrent?"currentTile":null);
    start=addDays(start,7);
  }
  scrollToCurrent();
}

function renderWeeks(){
  setState("Continuous Week Grid",`W /// 1 — W /// ${totalWeeks()}`,6);
  const now=sod(new Date());
  let start=new Date(BIRTH);
  while(start<END){
    const weekStart=new Date(start);
    const isCurrent=now>=weekStart&&now<=addDays(weekStart,6);
    tile([formatWeekRange(weekStart),`W /// ${weekNumFromStart(weekStart)}`],clsForDate(weekStart),()=>render("weekDays",{start:weekStart}),isCurrent?"currentTile":null);
    start=addDays(start,7);
  }
  scrollToCurrent();
}

function renderWeekDays(start){
  const weekStart=sod(start);
  setState("Week Grid",formatWeekRange(weekStart),7);
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i);
    tile([formatMonthDay(d),`D /// ${dayNum(d)}`],clsForDate(d),()=>openDay(d),+sod(d)===+sod(new Date())?"currentTile":null,d);
  }
  scrollToCurrent();
}

function renderDays(){
  setState("Daily Grid","CURRENT WINDOW",7);
  const today=sod(new Date());
  const start=addDays(today,-180);
  const end=addDays(today,365);
  let d=clampDate(start);
  while(d<end&&d<END){
    const cur=new Date(d);
    tile([formatMonthDay(cur),`D /// ${dayNum(cur)}`],clsForDate(cur),()=>openDay(cur),+sod(cur)===+today?"currentTile":null,cur);
    d=addDays(d,1);
  }
  scrollToCurrent();
}

function openDay(d){
  selectedDay=sod(d);
  panelTitle.innerText=`${formatMonthDay(selectedDay)} / D /// ${dayNum(selectedDay)}`;
  panelMeta.innerHTML=`W /// ${weekNumFromStart(selectedDay)}<br>M /// ${monthNum(selectedDay.getFullYear(),selectedDay.getMonth())}<br>Y /// ${yearNum(selectedDay.getFullYear())}`;
  dayNote.value=localStorage.getItem(dayKey(selectedDay)+"_note")||"";
  dayPanel.classList.add("active");
}

dayNote.addEventListener("input",()=>{
  if(selectedDay)localStorage.setItem(dayKey(selectedDay)+"_note",dayNote.value);
});

function togglePhotoMarker(){
  if(!selectedDay)return;
  const key=dayKey(selectedDay)+"_photo";
  if(localStorage.getItem(key)==="1")localStorage.removeItem(key);
  else localStorage.setItem(key,"1");
  dayPanel.classList.remove("active");
  render(currentRender.mode,currentRender.data,false);
}

function closePanel(){
  dayPanel.classList.remove("active");
}

function goBack(){
  const last=historyStack.pop();
  if(!last){render("years",null,false);return}
  render(last.mode,last.data,false);
}

meta();
render("years",null,false);
</script>

</body>
</html>
