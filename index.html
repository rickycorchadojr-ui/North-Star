<style>
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.app{height:100vh;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.topbar{
  height:92px;

  grid-template-columns:1fr 420px 1fr;

.brand{font-size:16px;text-transform:lowercase}
.label,.meta,.view-title{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.meta{text-align:right;line-height:1.35}
.meter{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
#meterLabel{font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.8}
#meterGrid{display:grid;gap:2px;justify-content:center;max-width:420px}
.meter-square{width:6px;height:6px;border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.08)}
.meter-square.filled{background:#eee;border-color:#eee}
.meter-square.current{background:#eee;border-color:#eee;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
#meterSub{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.62}

button{background:#0d0f12;color:#eee;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(0,0,0,.65)}

.grid-wrap{flex:1;overflow:auto;background:#08090a;scroll-behavior:auto}
.weekday-header{
  display:none;

  border-left:2px solid rgba(255,255,255,.55);

}

.weekday-header.active{
  display:grid;
}

.weekday-cell{
  padding:5px 8px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  opacity:.65;

}
.grid{display:grid;align-content:start;min-height:100%;border-top:2px solid rgba(255,255,255,.55);border-left:2px solid rgba(255,255,255,.55)}
.tile{position:relative;aspect-ratio:1/1;min-height:auto;border-right:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.55);background:#14171b;padding:7px 8px;overflow:visible;cursor:pointer;background-size:cover;background-position:center;background-repeat:no-repeat}
.tile:nth-child(even){background-color:#111418}
.tile.has-image .tile-text{text-shadow:0 1px 3px #000,0 0 8px #000}
.tile.current{outline:4px solid #eee;outline-offset:-4px;background-color:#20242b;z-index:4}
.tile.future{opacity:.38}
.tile.past{opacity:.82}
.tile.current .tile-metrics{opacity:1}

.tile-metrics{
  position:absolute;
  right:6px;
  bottom:6px;
  z-index:75;
  display:flex;
  align-items:flex-end;
  gap:3px;
}

.metric-grid{
  display:grid;
  grid-template-columns:repeat(2,18px);
  grid-template-rows:repeat(2,18px);
  gap:2px;
}

.metric-square{
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:900;
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  text-shadow:0 1px 2px #000;
}

.metric-sleep{background:#666}
.metric-health{background:#b89521}
.metric-life{background:#6eb6d9}
.metric-work{background:#1d4f9a}

.state-square{
  background:#08090a;
  border-color:rgba(255,255,255,.32);
}

.state-empty{
  color:rgba(255,255,255,.35);
}


.tile::before,.tile::after{content:"";position:absolute;background:#eee;z-index:50;pointer-events:none;opacity:1}
.tile::before{width:10px;height:2px;right:-6px;bottom:-2px}
.tile::after{width:2px;height:10px;right:-2px;bottom:-6px}
.tile-text{position:relative;z-index:70;font-size:10px;font-weight:900;line-height:1.08;letter-spacing:.45px;text-transform:uppercase}

.activity-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}

</style>

const APP_VERSION="1.0.0-alpha";
const BIRTH=new Date(1987,5,26);
const HORIZON_YEARS=110;
const END=new Date(2097,5,26);
const MS_DAY=86400000;
const DAY_MINUTES=1440;
const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const WORKER_URL="https://withered-glade-1589.rickycorchadojr.workers.dev";
const UPLOAD_KEY_STORAGE="northStarUploadKey";
const MONTHLY_HABIT_STORAGE="northStarMonthlyHabit";
const FREQ_DAYS={
  sun:0,
  mon:1,
  tue:2,
  wed:3,
  thu:4,
  fri:5,
  sat:6
};
const PILLAR_PROTOCOLS={
  sleep:[
    {name:"Wake Early",minutes:1,capacity:"Discipline"},
    {name:"Go to Bed Early",minutes:1,capacity:"Preparation"}
  ],
  health:[
    {name:"Read Bible",minutes:5,capacity:"Faith"},

    {name:"Stretch",minutes:10,capacity:"Flexibility"},
    {name:"Read How To Read a Book",minutes:5,capacity:"Intelligence"},
    {name:"Meditation",minutes:5,capacity:"Mindfulness"},
    {name:"Drink Water",minutes:3,capacity:"Hydration"}
  ],
  life:[
    {name:"Make Bed",minutes:5,capacity:"Discipline"},
    {name:"Bullet Journal",minutes:5,capacity:"Preparation"},
    {name:"Examen",minutes:10,capacity:"Review"},
    {name:"Reset Alarms",minutes:1,capacity:"Preparation"},
    {name:"Read Walden",minutes:10,capacity:"Mindfulness"},
    {name:"Find Some Joy",minutes:5,capacity:"Happiness"},
    {name:"Gratitude / Small Wins",minutes:5,capacity:"Happiness"},
    {name:"Clean",minutes:30,capacity:"Service"}
  ],
  work:[
    {name:"Deepwork",minutes:30,capacity:"Dream Projects"},
    {name:"Pre-market Prep",minutes:10,capacity:"Preparation"},
    {name:"5 Min Gratitude & Forgiveness",minutes:10,capacity:"Preparation"},
    {name:"Positive Priming",minutes:5,capacity:"Preparation"},
    {name:"Record Session",minutes:1,capacity:"Preparation"},
    {name:"Trade",minutes:5,capacity:"Trading Skill"},
    {name:"Import Trades",minutes:5,capacity:"Review"},
    {name:"Upload Recording",minutes:5,capacity:"Review"},
    {name:"5 Contract Habit Tracker",minutes:5,capacity:"Review"},
    {name:"Journal Trades",minutes:5,capacity:"Insight"},
    {name:"Journal",minutes:5,capacity:"Insight"},
    {name:"Drills",minutes:10,capacity:"Trading Skill"},
    {name:"Read Psycho-Cybernetics",minutes:15,capacity:"Insight"},
    {name:"Animation Exercise",minutes:10,capacity:"Dream Projects"},
    {name:"Drawing Exercise",minutes:20,capacity:"Dream Projects"},
    {name:"Work on Apps",minutes:20,capacity:"Projects"},
    {name:"Work on Animation",minutes:20,capacity:"Dream Projects"},
    {name:"1% Better at Trading",minutes:5,capacity:"Insight"},
    {name:"Work on Pocketbook",minutes:5,capacity:"Projects"},
    {name:"Japanese",minutes:5,capacity:"Future Opportunity"},
    {name:"369 Manifestation",minutes:5,capacity:"Manifesting"}
  ]
};


let historyStack=[];
let currentRender={mode:"days",data:null};
let selectedDay=null;
let selectedFile=null;

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayNum(d){return Math.floor((sod(d)-sod(BIRTH))/MS_DAY)+1}
function ageYears(d=new Date()){return (d-BIRTH)/(MS_DAY*365.2425)}
function yearNum(y){return y-BIRTH.getFullYear()}
function monthNum(y,m){return (y-BIRTH.getFullYear())*12+m+1}
function lifeWeekNum(d){return Math.floor((sod(d)-sod(BIRTH))/(MS_DAY*7))+1}
function calendarWeekStart(d){const x=sod(d);x.setDate(x.getDate()-x.getDay());return x}
function calendarWeekIndex(d){return Math.floor((calendarWeekStart(d)-calendarWeekStart(BIRTH))/(MS_DAY*7))+1}
function totalWeeks(){return calendarWeekIndex(addDays(END,-1))}
function clampDate(d){if(d<BIRTH)return new Date(BIRTH);if(d>=END)return new Date(END);return d}
function formatMonthDay(d){return `${MONTHS[d.getMonth()]} ${d.getDate()}`}
function formatWeekRange(start){
  const end=addDays(start,6);
  return start.getMonth()===end.getMonth()
    ? `${MONTHS[start.getMonth()]} ${start.getDate()}—${end.getDate()}`
    : `${MONTHS[start.getMonth()]} ${start.getDate()}—${MONTHS[end.getMonth()]} ${end.getDate()}`;
}
function dayOfYear(d){const start=new Date(d.getFullYear(),0,1);return Math.floor((sod(d)-sod(start))/MS_DAY)+1}
function daysInYear(y){return new Date(y,1,29).getMonth()===1?366:365}
function calendarWeekOfYear(d){return Math.floor((calendarWeekStart(d)-calendarWeekStart(new Date(d.getFullYear(),0,1)))/(MS_DAY*7))+1}
function weeksInCurrentYear(){return calendarWeekOfYear(new Date(new Date().getFullYear(),11,31))}
function daysLeftInYear(){const now=sod(new Date());const last=new Date(now.getFullYear(),11,31);return Math.floor((sod(last)-now)/MS_DAY)}
function dayKey(d){return `ns_day_${dayNum(d)}`}
function getImageUrl(d){return localStorage.getItem(dayKey(d)+"_image")||""}
function activitiesKey(d){return dayKey(d)+"_activities"}
function blocksKey(d){return dayKey(d)+"_blocks"}
function timeToMinutes(time){
  if(!time)return null;
  const parts=time.split(":");
  if(parts.length!==2)return null;
  const h=parseInt(parts[0],10);
  const m=parseInt(parts[1],10);
  if(Number.isNaN(h)||Number.isNaN(m))return null;
  return (h*60)+m;
}

function blockDuration(start,end){
  const s=timeToMinutes(start);
  const e=timeToMinutes(end);
  if(s===null||e===null)return 0;

  if(e>s)return e-s;

  return (DAY_MINUTES-s)+e;
}

function formatBlockTime(start,end){
  return `${start}–${end}`;
}
function monthKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function getMonthlyHabit(){
  try{
    return JSON.parse(localStorage.getItem(MONTHLY_HABIT_STORAGE)||"null");
  }catch(e){
    return null;
  }
}

function habitAppliesToDate(habit,d){
  if(!habit)return false;
  if(habit.monthKey!==monthKey(d))return false;

  const day=d.getDay();

  if(habit.frequency==="daily")return true;
  if(habit.frequency==="weekdays")return day>=1&&day<=5;
  if(habit.frequency==="weekends")return day===0||day===6;

  return FREQ_DAYS[habit.frequency]===day;
}

function getHabitMinutesForDate(habit,d){
  if(!habit)return 0;

  return getActivitiesForDate(d)
    .filter(activity=>
      activity.category===habit.pillar &&
      activity.name.toLowerCase()===habit.name.toLowerCase()
    )
    .reduce((sum,activity)=>sum+(parseInt(activity.minutes,10)||0),0);
}

function habitCompleteForDate(d){
  const habit=getMonthlyHabit();
  if(!habitAppliesToDate(habit,d))return true;

  return getHabitMinutesForDate(habit,d)>=habit.minutes;
}

function protocolListForCategory(category,d=null){
  const protocol=[...(PILLAR_PROTOCOLS[category]||[])];
  const habit=getMonthlyHabit();

  if(
    habit &&
    habit.pillar===category &&
    d &&
    habitAppliesToDate(habit,d)
  ){
    const index=protocol.findIndex(
      item=>item.name.toLowerCase()===habit.name.toLowerCase()
    );

    const monthlyItem={
      name:habit.name,
      minutes:habit.minutes,
      capacity:habit.capacity
    };

    if(index>=0){
      protocol[index]=monthlyItem;
    }else{
      protocol.push(monthlyItem);
    }
  }

  return protocol;
}

function monthlyHabitProgress(){
  const habit=getMonthlyHabit();
  if(!habit)return null;

  const now=sod(new Date());
  const first=new Date(now.getFullYear(),now.getMonth(),1);
  const last=new Date(now.getFullYear(),now.getMonth()+1,0);

  let required=0;
  let complete=0;

  let d=first;
  while(d<=last){
    if(habitAppliesToDate(habit,d)){
      required++;
      if(habitCompleteForDate(d))complete++;
    }
    d=addDays(d,1);
  }

  return {
    required,
    complete,
    percent:required?Math.round((complete/required)*100):0
  };
}

function renderMonthlyHabitStatus(){

  habitCapacity.value=habit.capacity||"Discipline";
  habitMinutes.value=habit.minutes||"";
  habitFrequency.value=habit.frequency||"daily";

  const logged=selectedDay?getHabitMinutesForDate(habit,selectedDay):0;
  const applies=selectedDay&&habitAppliesToDate(habit,selectedDay);
  const progress=monthlyHabitProgress();

  monthlyHabitStatus.innerText=
    `${habit.name.toUpperCase()} / ${habit.pillar.toUpperCase()} / ${habit.capacity.toUpperCase()} / ${habit.minutes}M / ${habit.frequency.toUpperCase()}`
    + `\nTODAY: ${applies ? `${logged}/${habit.minutes}M` : "NOT SCHEDULED"}`
    + `\nMONTH: ${progress.complete}/${progress.required} DAYS / ${progress.percent}%`;
}

async function getUploadKey(forcePrompt=false){
  let uploadKey=localStorage.getItem(UPLOAD_KEY_STORAGE);
  if(forcePrompt||!uploadKey){
    const entered=prompt("UPLOAD KEY");
    if(!entered)return "";
    localStorage.setItem(UPLOAD_KEY_STORAGE,entered);
    uploadKey=entered;
  }
  return uploadKey;
}

async function attemptPhotoUpload(fileName,file,forcePrompt=false){
  const uploadKey=await getUploadKey(forcePrompt);
  if(!uploadKey)return {ok:false,status:0};
  const response=await fetch(WORKER_URL+"/upload/"+fileName,{
    method:"POST",
    headers:{"x-upload-key":uploadKey,"content-type":file.type||"image/jpeg"},
    body:file
  });
  if(response.status===401)return {ok:false,status:401};
  if(!response.ok)return {ok:false,status:response.status};
  const data=await response.json();
  return {ok:true,status:response.status,url:data.url};
}

async function attemptDeleteFile(fileName,forcePrompt=false){
  const uploadKey=await getUploadKey(forcePrompt);
  if(!uploadKey)return {ok:false,status:0};
  const response=await fetch(WORKER_URL+"/delete/"+fileName,{
    method:"DELETE",
    headers:{"x-upload-key":uploadKey}
  });
  if(response.status===401)return {ok:false,status:401};
  if(!response.ok)return {ok:false,status:response.status};
  return {ok:true,status:response.status};
}

async function deleteR2ImageByUrl(url){
  const fileName=imageFileNameFromUrl(url);
  if(!fileName)return true;
  let result=await attemptDeleteFile(fileName,false);
  if(result.status===401){
    localStorage.removeItem(UPLOAD_KEY_STORAGE);
    result=await attemptDeleteFile(fileName,true);
  }
  return result.ok;
}

function renderYears(){

    tile([`${y}`,`Y /// ${yearNum(y)}`],cls,()=>render("yearMonths",{year:y}),y===nowY?"currentTile":null,img);

function renderYearMonths(y){
  setState("Year Grid",`${y} / Y /// ${yearNum(y)}`,4);

  for(let m=0;m<12;m++){
    const d=new Date(y,m,1);

    const isCurrent=y===now.getFullYear()&&m===now.getMonth();
    tile([`${MONTHS[m]}`,`M /// ${monthNum(y,m)}`],clsForDate(d,img,isCurrent),()=>render("monthWeeks",{year:y,month:m}),isCurrent?"currentTile":null,img);
  }

function renderMonths(){
  setState("Continuous Month Grid","M /// 1 — M /// 1320",4);
  const now=new Date();
  for(let y=1987;y<=2097;y++){
    for(let m=0;m<12;m++){
      const d=new Date(y,m,1);
      if(d>=END)break;
      const img=getMonthImage(y,m);
      const isCurrent=y===now.getFullYear()&&m===now.getMonth();
      tile([`${MONTHS[m]}`,`M /// ${monthNum(y,m)}`],clsForDate(d,img,isCurrent),()=>render("monthWeeks",{year:y,month:m}),isCurrent?"currentTile":null,img);
    }
  }
  scrollToCurrent();
}

function renderMonthWeeks(y,m){
  setState("Month Grid",`${MONTHS[m]} ${y}`,4);
  const now=sod(new Date());
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  let start=calendarWeekStart(first);
  while(start<=last){
    const weekStart=new Date(start);
    const img=getWeekImage(weekStart);
    const isCurrent=now>=weekStart&&now<=addDays(weekStart,6);
    tile([formatWeekRange(weekStart),`W /// ${calendarWeekIndex(weekStart)}`],clsForDate(weekStart,img,isCurrent),()=>render("weekDays",{start:weekStart}),isCurrent?"currentTile":null,img);
    start=addDays(start,7);
  }
  scrollToCurrent();
}

function renderWeeks(){
  setState("Continuous Week Grid",`W /// 1 — W /// ${totalWeeks()}`,4);
  const now=sod(new Date());
  let start=calendarWeekStart(BIRTH);
  while(start<END){
    const weekStart=new Date(start);
    const img=getWeekImage(weekStart);
    const isCurrent=now>=weekStart&&now<=addDays(weekStart,6);
    tile([formatWeekRange(weekStart),`W /// ${calendarWeekIndex(weekStart)}`],clsForDate(weekStart,img,isCurrent),()=>render("weekDays",{start:weekStart}),isCurrent?"currentTile":null,img);
    start=addDays(start,7);
  }
  scrollToCurrent();
}

function renderWeekDays(start){
  const weekStart=calendarWeekStart(start);
  setState("Week Grid",formatWeekRange(weekStart),7);
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i);
    const img=getImageUrl(d);
    tile([formatMonthDay(d),`D /// ${dayNum(d)}`],clsForDate(d,img),()=>openDay(d),+sod(d)===+sod(new Date())?"currentTile":null,img,d);
  }
  scrollToCurrent();
}

function renderDays(){
  setState("Daily Grid","CURRENT WINDOW",7);
  const today=sod(new Date());
  const windowStart=addDays(today,-180);
  const start=calendarWeekStart(windowStart);
  const end=addDays(calendarWeekStart(addDays(today,365)),7);

  let d=clampDate(start);
  while(d<end&&d<END){
    const cur=new Date(d);
    const img=getImageUrl(cur);
    tile([formatMonthDay(cur),`D /// ${dayNum(cur)}`],clsForDate(cur,img),()=>openDay(cur),+sod(cur)===+today?"currentTile":null,img,cur);
    d=addDays(d,1);
  }
  scrollToCurrent();
}

  try{
    return JSON.parse(localStorage.getItem(activitiesKey(d))||"[]");
  }catch(e){
    return [];
  }
}

function getSleepMinutesForDate(d){
  const h=parseInt(localStorage.getItem(dayKey(d)+"_sleep_hours"),10)||0;
  const m=parseInt(localStorage.getItem(dayKey(d)+"_sleep_minutes"),10)||0;
  return (h*60)+m;
}

function sleepScoreFromMinutes(minutes){
  if(!minutes)return "";
  const score=Math.min((minutes/480)*10,10);
  return score.toFixed(1);
}

function calculateTotalsForDate(d){
  const totals={
    sleep:getSleepMinutesForDate(d),
    health:0,
    life:0,
    work:0
  };

  getActivitiesForDate(d).forEach(activity=>{
    const minutes=parseInt(activity.minutes,10)||0;
    if(activity.category==="health")totals.health+=minutes;
    if(activity.category==="life")totals.life+=minutes;
    if(activity.category==="work")totals.work+=minutes;
  });

  totals.tracked=totals.sleep+totals.health+totals.life+totals.work;
  return totals;
}

function hasDayMetricData(d){
  const totals=calculateTotalsForDate(d);
  return totals.tracked>0;
}

function percentOfDay(minutes){
  if(!minutes)return "-";
  return String(Math.round((minutes/DAY_MINUTES)*100));
}

function sleepDecimalForDate(d){
  const mins=getSleepMinutesForDate(d);
  if(!mins)return "";
  const value=mins/60;
  return Number.isInteger(value)?String(value):value.toFixed(1);
}

function getSleepScoreForDate(d){
  return sleepScoreFromMinutes(getSleepMinutesForDate(d));
}


function getReadinessScoreForDate(d){
  return localStorage.getItem(dayKey(d)+"_readiness_score")||"";
}

function getMotivationScoreForDate(d){
  return localStorage.getItem(dayKey(d)+"_motivation_score")||"";
}

function scoreValue(value){
  return value?value:"-";
}

function protocolScoreForDate(d,category){
  const protocol=protocolListForCategory(category,d);
  if(!protocol.length)return 0;

  const activities=getActivitiesForDate(d);
  let earned=0;

  protocol.forEach(required=>{
    const logged=activities
      .filter(activity=>
        activity.category===category &&
        activity.name.toLowerCase()===required.name.toLowerCase()
      )
      .reduce((sum,activity)=>sum+(parseInt(activity.minutes,10)||0),0);

    const completion=Math.min(logged/required.minutes,1);
    earned+=completion;
  });

  return Math.round((earned/protocol.length)*100);
}

function dayScoreForDate(d){
  const scores=[
    parseFloat(getSleepScoreForDate(d)),
    parseFloat(getReadinessScoreForDate(d)),
    parseFloat(getMotivationScoreForDate(d)),
    protocolScoreForDate(d,"health")/10,
    protocolScoreForDate(d,"life")/10,
    protocolScoreForDate(d,"work")/10
  ].filter(score=>score>=0&&score<=10);

  if(!scores.length)return "";
  const total=scores.reduce((sum,score)=>sum+score,0);
  return (total/scores.length).toFixed(1);
}

function renderActivityList(){
  if(!selectedDay)return;

  const blocks=getBlocks().sort((a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start));
  const activities=getActivities();
  const blockIds=blocks.map(block=>block.id);

  const manualActivities=activities.filter(activity=>
    !activity.blockId && !blockIds.includes(activity.id)
  );

  activityList.innerHTML="";
  renderProtocolList();

  if(!blocks.length && !manualActivities.length){
    const empty=document.createElement("div");
    empty.className="activity-meta";
    empty.innerText="NO TIME BLOCKS OR ACTIVITIES LOGGED";
    activityList.appendChild(empty);
    return;
  }

  if(blocks.length){
    const blockTitle=document.createElement("div");
    blockTitle.className="activity-meta";
    blockTitle.innerText="TIME BLOCKS";
    activityList.appendChild(blockTitle);

    blocks.forEach(block=>{
      const item=document.createElement("div");
      item.className="block-item";
      item.innerHTML=`
        <div>
          <div class="block-time">${formatBlockTime(block.start,block.end)}</div>
          <div class="block-name">${block.name}</div>
          <div class="block-meta">${formatActivityCategory(block.category)} / ${block.capacity || "UNCATEGORIZED"} / ${block.minutes}M</div>
        </div>
        <button class="activity-delete" onclick="deleteBlock('${block.id}')">X</button>
      `;
      activityList.appendChild(item);
    });
  }

  if(manualActivities.length){
    const manualTitle=document.createElement("div");
    manualTitle.className="activity-meta";
    manualTitle.innerText="MANUAL ACTIVITY MINUTES";
    activityList.appendChild(manualTitle);

    manualActivities.forEach(activity=>{
      const item=document.createElement("div");
      item.className="activity-item";
      item.innerHTML=`
        <div class="activity-name">${activity.name}</div>
        <div class="activity-meta">${formatActivityCategory(activity.category)} / ${activity.minutes}M</div>
        <button class="activity-delete" onclick="deleteActivity('${activity.id}')">X</button>
      `;
      activityList.appendChild(item);
    });
  }
}

function addPresetActivity(name,minutes,category){
  if(!selectedDay)return;

  const activities=getActivities();
  const existing=activities.find(activity=>
    activity.name.toLowerCase()===name.toLowerCase() &&
    activity.category===category
  );

  if(existing){
    existing.minutes=(parseInt(existing.minutes,10)||0)+minutes;
  }else{
    activities.push({
      id:String(Date.now())+"-"+Math.random().toString(16).slice(2),
      name,
      minutes,
      category
    });
  }

  saveActivities(activities);
  renderActivityList();

function addBlock(){
  if(!selectedDay)return;

  const start=blockStart.value;
  const end=blockEnd.value;
  const name=blockName.value.trim();
  const category=blockCategory.value;
  const capacity=blockCapacity.value;
  const minutes=blockDuration(start,end);

  if(!start){alert("ENTER START TIME");return}
  if(!end){alert("ENTER END TIME");return}
  if(!name){alert("ENTER BLOCK NAME");return}
  if(!minutes||minutes<1){alert("INVALID TIME BLOCK");return}

  const block={
    id:String(Date.now())+"-"+Math.random().toString(16).slice(2),
    name,
    category,
    capacity,
    start,
    end,
    minutes
  };

  const blocks=getBlocks();
  blocks.push(block);
  saveBlocks(blocks);

  addActivityFromBlock(block);

  blockStart.value="";
  blockEnd.value="";
  blockName.value="";
  blockCategory.value="work";
  blockCapacity.value="Preparation";

  renderActivityList();
  renderTotals();
  renderMonthlyHabitStatus();
}

function addActivityFromBlock(block){
  const activities=getActivities();
  const existing=activities.find(activity=>
    activity.name.toLowerCase()===block.name.toLowerCase() &&
    activity.category===block.category
  );

  if(existing){
    existing.minutes=(parseInt(existing.minutes,10)||0)+block.minutes;
  }else{
    activities.push({
      id:block.id,
      blockId:block.id,
      name:block.name,
      minutes:block.minutes,
      category:block.category,
      capacity:block.capacity
    });
  }

  saveActivities(activities);
}

function deleteBlock(id){
  if(!selectedDay)return;

  const blocks=getBlocks();
  const block=blocks.find(item=>item.id===id);

  saveBlocks(blocks.filter(item=>item.id!==id));

  if(block){
    const activities=getActivities();
    const matching=activities.find(activity=>activity.blockId===id || activity.id===id);

    if(matching){
      saveActivities(activities.filter(activity=>activity.id!==matching.id));
    }
  }

  renderActivityList();
  renderTotals();
  renderMonthlyHabitStatus();
}

function getSleepMinutes(){
  const h=parseInt(sleepHours.value,10)||0;
  const m=parseInt(sleepMinutes.value,10)||0;
  return (h*60)+m;
}

function protocolScore(category){
  if(!selectedDay)return 0;

  const protocol=protocolListForCategory(category,selectedDay);
  if(!protocol.length)return 0;

  const activities=getActivities();
  let earned=0;

  protocol.forEach(required=>{
    const logged=activities
      .filter(activity=>
        activity.category===category &&
        activity.name.toLowerCase()===required.name.toLowerCase()
      )
      .reduce((sum,activity)=>sum+(parseInt(activity.minutes,10)||0),0);

    const completion=Math.min(logged/required.minutes,1);
    earned+=completion;
  });

  return Math.round((earned/protocol.length)*100);
}

function calculateTotals(){
  const totals={
    sleep:getSleepMinutes(),
    health:0,
    life:0,
    work:0
  };

  getActivities().forEach(activity=>{
    const minutes=parseInt(activity.minutes,10)||0;
    if(activity.category==="health")totals.health+=minutes;
    if(activity.category==="life")totals.life+=minutes;
    if(activity.category==="work")totals.work+=minutes;
  });

  totals.tracked=totals.sleep+totals.health+totals.life+totals.work;
  totals.untracked=DAY_MINUTES-totals.tracked;
  totals.trackedPercent=Math.round((totals.tracked/DAY_MINUTES)*100);

  return totals;
}

function formatMinutes(total){
  const sign=total<0?"-":"";
  const n=Math.abs(total);
  const h=Math.floor(n/60);
  const m=n%60;
  if(h&&m)return `${sign}${h}H ${m}M`;
  if(h)return `${sign}${h}H`;
  return `${sign}${m}M`;
}

function addTotalBox(label,value){
  const box=document.createElement("div");
  box.className="total-box";
  box.innerHTML=`<div class="total-label">${label}</div><div class="total-value">${value}</div>`;
  totalsGrid.appendChild(box);
}

function renderTotals(){
  if(!selectedDay)return;
  const totals=calculateTotals();
  totalsGrid.innerHTML="";

  addTotalBox("Sleep",formatMinutes(totals.sleep));
  addTotalBox("Health Time",formatMinutes(totals.health));
  addTotalBox("Life Time",formatMinutes(totals.life));
  addTotalBox("Work Time",formatMinutes(totals.work));

  addTotalBox("Health Score",`${protocolScore("health")}%`);
  addTotalBox("Life Score",`${protocolScore("life")}%`);
  addTotalBox("Work Score",`${protocolScore("work")}%`);

  addTotalBox("Tracked",`${totals.trackedPercent}%`);
  addTotalBox(totals.untracked>=0?"Untracked":"Over",formatMinutes(totals.untracked));
}

async function uploadPhoto(){
  if(!selectedDay){alert("NO DAY SELECTED");return}
  if(!selectedFile){alert("SELECT PHOTO FIRST");return}

  const oldUrl=getImageUrl(selectedDay);
  const fileName=uniqueImageFileName(selectedDay,selectedFile);
  let result=await attemptPhotoUpload(fileName,selectedFile,false);

  if(result.status===401){
    localStorage.removeItem(UPLOAD_KEY_STORAGE);
    result=await attemptPhotoUpload(fileName,selectedFile,true);
  }

  if(!result.ok){alert("UPLOAD FAILED");return}

  localStorage.setItem(dayKey(selectedDay)+"_image",result.url);

  if(oldUrl&&oldUrl!==result.url){
    await deleteR2ImageByUrl(oldUrl);
  }

  dayPanel.classList.remove("active");
  render(currentRender.mode,currentRender.data,false);
}

async function clearImageUrl(){
  if(!selectedDay)return;

  const oldUrl=getImageUrl(selectedDay);
  localStorage.removeItem(dayKey(selectedDay)+"_image");

  if(oldUrl){
    const deleted=await deleteR2ImageByUrl(oldUrl);
    if(!deleted)alert("IMAGE REMOVED LOCALLY. CLOUD DELETE FAILED.");
  }

  dayPanel.classList.remove("active");
  render(currentRender.mode,currentRender.data,false);
}

      data[key]=localStorage.getItem(key);
    }
    if(key===UPLOAD_KEY_STORAGE||key===MONTHLY_HABIT_STORAGE){
  data[key]=localStorage.getItem(key);
}
  }
  return data;
}

function exportSave(){
  const now=new Date();
  const stamp=now.toISOString().slice(0,10);
  const save={
    app:"North Star",
    version:APP_VERSION,
    exportedAt:now.toISOString(),
    localStorage:northStarStorageSnapshot()
  };

  const blob=new Blob([JSON.stringify(save,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=`north-star-save-v${APP_VERSION}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}
