<!DOCTYPE html>
<html>
<head>
  <title>North Star</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="North Star">
  <meta name="theme-color" content="#050505">

<style>
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.app{height:100vh;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.topbar{height:70px;display:grid;grid-template-columns:1fr 420px 1fr;align-items:flex-start;font-weight:800}
.brand{font-size:16px;text-transform:lowercase}
.label,.meta,.view-title{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.meta{text-align:right;line-height:1.35}
.meter{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
#meterLabel{font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.8}
#meterGrid{display:grid;gap:2px;justify-content:center;max-width:420px}
.meter-square{width:6px;height:6px;border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.08)}
.meter-square.filled{background:#eee;border-color:#eee}
.meter-square.current{background:#eee;border-color:#eee;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
#meterSub{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.62}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.view-title{text-align:right;margin-left:auto;white-space:nowrap}
button{background:#0d0f12;color:#eee;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(0,0,0,.65)}
button:hover{background:#15181c;border-color:rgba(255,255,255,.38)}
.utility-dock{position:fixed;left:22px;bottom:22px;z-index:180;display:flex;gap:8px}
.icon-button{width:34px;height:34px;padding:0;border-radius:50%;font-size:17px;letter-spacing:0;display:flex;align-items:center;justify-content:center;opacity:.72}
.icon-button:hover{opacity:1}
.grid-wrap{flex:1;overflow:auto;background:#08090a;scroll-behavior:auto}
.weekday-header{
  display:none;
  grid-template-columns:repeat(7,1fr);
  background:#050505;
  border-left:2px solid rgba(255,255,255,.55);
  border-right:2px solid rgba(255,255,255,.55);
}

.weekday-header.active{
  display:grid;
}

.weekday-cell{
  padding:5px 8px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  opacity:.65;
  border-right:2px solid rgba(255,255,255,.35);
}
.grid{display:grid;align-content:start;min-height:100%;border-top:2px solid rgba(255,255,255,.55);border-left:2px solid rgba(255,255,255,.55)}
.tile{position:relative;aspect-ratio:1/1;min-height:auto;border-right:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.55);background:#14171b;padding:7px 8px;overflow:visible;cursor:pointer;background-size:cover;background-position:center;background-repeat:no-repeat}
.tile:nth-child(even){background-color:#111418}
.tile.has-image .tile-text{text-shadow:0 1px 3px #000,0 0 8px #000}
.tile.current{outline:4px solid #eee;outline-offset:-4px;background-color:#20242b;z-index:4}
.tile.future{opacity:.38}
.tile.past{opacity:.82}
.tile.current .tile-metrics{opacity:1}

.tile-metrics{
  position:absolute;
  right:6px;
  bottom:6px;
  z-index:75;
  display:flex;
  align-items:flex-end;
  gap:3px;
}

.metric-grid{
  display:grid;
  grid-template-columns:repeat(2,18px);
  grid-template-rows:repeat(2,18px);
  gap:2px;
}

.metric-square{
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:900;
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  text-shadow:0 1px 2px #000;
}

.metric-sleep{background:#666}
.metric-health{background:#b89521}
.metric-life{background:#6eb6d9}
.metric-work{background:#1d4f9a}

.state-square{
  background:#08090a;
  border-color:rgba(255,255,255,.32);
}

.state-empty{
  color:rgba(255,255,255,.35);
}


.tile::before,.tile::after{content:"";position:absolute;background:#eee;z-index:50;pointer-events:none;opacity:1}
.tile::before{width:10px;height:2px;right:-6px;bottom:-2px}
.tile::after{width:2px;height:10px;right:-2px;bottom:-6px}
.tile-text{position:relative;z-index:70;font-size:10px;font-weight:900;line-height:1.08;letter-spacing:.45px;text-transform:uppercase}
.panel{position:fixed;right:22px;bottom:22px;width:380px;background:#090a0c;border:2px solid rgba(255,255,255,.55);padding:14px;z-index:200;display:none;box-shadow:0 20px 60px rgba(0,0,0,.65)}
.panel.active{display:block}
.panel-title{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.panel-meta{font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.65;line-height:1.45;margin-bottom:10px}
textarea,input,select{width:100%;background:#050505;color:#eee;border:1px solid rgba(255,255,255,.25);padding:10px;font-size:12px;font-weight:800;outline:none}
textarea{height:100px;resize:none}
.field-label{font-size:9px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;opacity:.55;margin-top:10px;margin-bottom:4px}
.photo-name{margin-top:8px;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.65;word-break:break-all}
.sleep-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.state-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.activity-row{display:grid;grid-template-columns:1.4fr .7fr .9fr;gap:8px}
.activity-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.activity-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#050505;border:1px solid rgba(255,255,255,.16);padding:7px 8px}
.activity-name{font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase}
.activity-meta{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.65;white-space:nowrap}
.activity-delete{padding:3px 7px;font-size:9px;border-radius:4px}
.totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.total-box{background:#050505;border:1px solid rgba(255,255,255,.16);padding:7px 8px}
.total-label{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;opacity:.55}
.total-value{font-size:12px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;margin-top:2px}
.panel-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
</style>
</head>

<body>
<div class="app">

<div class="panel" id="dayPanel">

<script>
const APP_VERSION="0.8.6";
const BIRTH=new Date(1987,5,26);
const HORIZON_YEARS=110;
const END=new Date(2097,5,26);
const MS_DAY=86400000;
const DAY_MINUTES=1440;
const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const WORKER_URL="https://withered-glade-1589.rickycorchadojr.workers.dev";
const UPLOAD_KEY_STORAGE="northStarUploadKey";

let historyStack=[];
let currentRender={mode:"days",data:null};
let selectedDay=null;
let selectedFile=null;

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayNum(d){return Math.floor((sod(d)-sod(BIRTH))/MS_DAY)+1}
function ageYears(d=new Date()){return (d-BIRTH)/(MS_DAY*365.2425)}
function yearNum(y){return y-BIRTH.getFullYear()}
function monthNum(y,m){return (y-BIRTH.getFullYear())*12+m+1}
function lifeWeekNum(d){return Math.floor((sod(d)-sod(BIRTH))/(MS_DAY*7))+1}
function calendarWeekStart(d){const x=sod(d);x.setDate(x.getDate()-x.getDay());return x}
function calendarWeekIndex(d){return Math.floor((calendarWeekStart(d)-calendarWeekStart(BIRTH))/(MS_DAY*7))+1}
function totalWeeks(){return calendarWeekIndex(addDays(END,-1))}
function clampDate(d){if(d<BIRTH)return new Date(BIRTH);if(d>=END)return new Date(END);return d}
function formatMonthDay(d){return `${MONTHS[d.getMonth()]} ${d.getDate()}`}
function formatWeekRange(start){
  const end=addDays(start,6);
  return start.getMonth()===end.getMonth()
    ? `${MONTHS[start.getMonth()]} ${start.getDate()}—${end.getDate()}`
    : `${MONTHS[start.getMonth()]} ${start.getDate()}—${MONTHS[end.getMonth()]} ${end.getDate()}`;
}
function dayOfYear(d){const start=new Date(d.getFullYear(),0,1);return Math.floor((sod(d)-sod(start))/MS_DAY)+1}
function daysInYear(y){return new Date(y,1,29).getMonth()===1?366:365}
function calendarWeekOfYear(d){return Math.floor((calendarWeekStart(d)-calendarWeekStart(new Date(d.getFullYear(),0,1)))/(MS_DAY*7))+1}
function weeksInCurrentYear(){return calendarWeekOfYear(new Date(new Date().getFullYear(),11,31))}
function daysLeftInYear(){const now=sod(new Date());const last=new Date(now.getFullYear(),11,31);return Math.floor((sod(last)-now)/MS_DAY)}
function dayKey(d){return `ns_day_${dayNum(d)}`}
function getImageUrl(d){return localStorage.getItem(dayKey(d)+"_image")||""}
function activitiesKey(d){return dayKey(d)+"_activities"}

function findFirstImageInRange(start,end){
  let d=sod(start);
  const last=sod(end);
  while(d<=last&&d<END){
    const img=getImageUrl(d);
    if(img)return img;
    d=addDays(d,1);
  }
  return "";
}

function getWeekImage(start){return findFirstImageInRange(start,addDays(start,6))}
function getMonthImage(y,m){return findFirstImageInRange(new Date(y,m,1),new Date(y,m+1,0))}
function getYearImage(y){return findFirstImageInRange(new Date(y,0,1),new Date(y,11,31))}
function imageFileNameFromUrl(url){if(!url)return "";return url.split("/img/")[1]||""}

function uniqueImageFileName(d,file){
  let ext="jpg";
  if(file.type&&file.type.includes("png"))ext="png";
  if(file.type&&file.type.includes("webp"))ext="webp";
  return dayNum(d)+"-"+Date.now()+"."+ext;
}

async function getUploadKey(forcePrompt=false){
  let uploadKey=localStorage.getItem(UPLOAD_KEY_STORAGE);
  if(forcePrompt||!uploadKey){
    const entered=prompt("UPLOAD KEY");
    if(!entered)return "";
    localStorage.setItem(UPLOAD_KEY_STORAGE,entered);
    uploadKey=entered;
  }
  return uploadKey;
}

async function attemptPhotoUpload(fileName,file,forcePrompt=false){
  const uploadKey=await getUploadKey(forcePrompt);
  if(!uploadKey)return {ok:false,status:0};
  const response=await fetch(WORKER_URL+"/upload/"+fileName,{
    method:"POST",
    headers:{"x-upload-key":uploadKey,"content-type":file.type||"image/jpeg"},
    body:file
  });
  if(response.status===401)return {ok:false,status:401};
  if(!response.ok)return {ok:false,status:response.status};
  const data=await response.json();
  return {ok:true,status:response.status,url:data.url};
}

async function attemptDeleteFile(fileName,forcePrompt=false){
  const uploadKey=await getUploadKey(forcePrompt);
  if(!uploadKey)return {ok:false,status:0};
  const response=await fetch(WORKER_URL+"/delete/"+fileName,{
    method:"DELETE",
    headers:{"x-upload-key":uploadKey}
  });
  if(response.status===401)return {ok:false,status:401};
  if(!response.ok)return {ok:false,status:response.status};
  return {ok:true,status:response.status};
}

async function deleteR2ImageByUrl(url){
  const fileName=imageFileNameFromUrl(url);
  if(!fileName)return true;
  let result=await attemptDeleteFile(fileName,false);
  if(result.status===401){
    localStorage.removeItem(UPLOAD_KEY_STORAGE);
    result=await attemptDeleteFile(fileName,true);
  }
  return result.ok;
}

function meta(){
  const now=new Date();
  const days=dayNum(now);
  const total=Math.floor(365.2425*HORIZON_YEARS);
  lifeMeta.innerHTML=`DAY ${days.toLocaleString()}<br>AGE ${ageYears(now).toFixed(2)}<br>${((days/total)*100).toFixed(2)}% TO 110<br><span style="opacity:.55">VER ${APP_VERSION}</span>`;
}

function updateMeter(mode){
  const now=new Date();
  let total=111,current=yearNum(now.getFullYear())+1,label=`CURRENT YEAR: ${yearNum(now.getFullYear())}`,sub="";
  if(mode==="months"||mode==="yearMonths"||mode==="monthWeeks"){total=12;current=now.getMonth()+1;label=`CURRENT MONTH: ${monthNum(now.getFullYear(),now.getMonth())}`;sub=`MONTH ${current} OF 12`}
  if(mode==="weeks"||mode==="weekDays"){total=weeksInCurrentYear();current=calendarWeekOfYear(now);label=`CURRENT WEEK: ${calendarWeekIndex(now)}`;sub=`WEEK ${current} OF ${total}`}
  if(mode==="days"){total=daysInYear(now.getFullYear());current=dayOfYear(now);label=`CURRENT DAY: ${dayNum(now)}`;sub=`DAYS LEFT: ${daysLeftInYear()}`}
  if(mode==="years"){sub=`YEAR ${yearNum(now.getFullYear())} OF 110`}

  meterLabel.innerText=label;
  meterSub.innerText=sub;
  meterGrid.innerHTML="";
  let cols=total;
  if(total>60)cols=37;
  if(total<=12)cols=total;
  if(total>12&&total<=60)cols=26;
  meterGrid.style.gridTemplateColumns=`repeat(${cols}, 6px)`;

  for(let i=1;i<=total;i++){
    const sq=document.createElement("div");
    sq.className="meter-square";
    if(i<current)sq.classList.add("filled");
    if(i===current)sq.classList.add("current");
    meterGrid.appendChild(sq);
  }
}

function setState(label,title,cols){
  viewLabel.innerText=label;
  currentView.innerText=title;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.innerHTML="";
  gridWrap.scrollTop=0;
  weekdayHeader.classList.toggle("active",cols===7);
  updateMeter(currentRender.mode);
}

function clsForDate(d,img=""){
  const now=sod(new Date());
  let cls=+sod(d)===+now?"current":d<now?"past":"future";
  if(img)cls+=" has-image";
  return cls;
}

function tile(lines,cls,onClick,id,image="",metricDate=null){
  const t=document.createElement("div");
  t.className="tile "+(cls||"");
  if(id)t.id=id;
  if(image)t.style.backgroundImage=`url("${image}")`;
  t.innerHTML=`
    <div class="tile-text">${lines.filter(Boolean).join("<br>")}</div>
    ${metricDate?tileMetricsHtml(metricDate):""}
  `;
  if(onClick)t.onclick=onClick;
  grid.appendChild(t);
}

function scrollToCurrent(){
  setTimeout(()=>{
    const cur=document.getElementById("currentTile");
    if(cur)gridWrap.scrollTop=Math.max(0,cur.offsetTop-180);
  },60);
}

function showRoot(mode){
  historyStack=[];
  render(mode,null,false);
}

function render(mode,data=null,push=true){
  closePanel();
  if(push)historyStack.push({...currentRender});

  currentRender={mode,data};
  if(mode==="years")renderYears();
  if(mode==="months")renderMonths();
  if(mode==="weeks")renderWeeks();
  if(mode==="days")renderDays();
  if(mode==="yearMonths")renderYearMonths(data.year);
  if(mode==="monthWeeks")renderMonthWeeks(data.year,data.month);
  if(mode==="weekDays")renderWeekDays(data.start);
}

function renderYears(){
  setState("Lifetime Grid","1987 — 2097",5);
  const nowY=new Date().getFullYear();
  for(let y=1987;y<=2097;y++){
    const img=getYearImage(y);
    const cls=(y===nowY?"current":y<nowY?"past":"future")+(img?" has-image":"");
    tile([`${y}`,`Y /// ${yearNum(y)}`],cls,()=>render("yearMonths",{year:y}),y===nowY?"currentTile":null,img);
  }
  scrollToCurrent();
}

function renderYearMonths(y){
  setState("Year Grid",`${y} / Y /// ${yearNum(y)}`,4);
  const now=new Date();
  for(let m=0;m<12;m++){
    const d=new Date(y,m,1);
    const img=getMonthImage(y,m);
    const isCurrent=y===now.getFullYear()&&m===now.getMonth();
    tile([`${MONTHS[m]}`,`M /// ${monthNum(y,m)}`],clsForDate(d,img),()=>render("monthWeeks",{year:y,month:m}),isCurrent?"currentTile":null,img);
  }
  scrollToCurrent();
}

function renderMonths(){
  setState("Continuous Month Grid","M /// 1 — M /// 1320",4);
  const now=new Date();
  for(let y=1987;y<=2097;y++){
    for(let m=0;m<12;m++){
      const d=new Date(y,m,1);
      if(d>=END)break;
      const img=getMonthImage(y,m);
      const isCurrent=y===now.getFullYear()&&m===now.getMonth();
      tile([`${MONTHS[m]}`,`M /// ${monthNum(y,m)}`],clsForDate(d,img),()=>render("monthWeeks",{year:y,month:m}),isCurrent?"currentTile":null,img);
    }
  }
  scrollToCurrent();
}

function renderMonthWeeks(y,m){
  setState("Month Grid",`${MONTHS[m]} ${y}`,4);
  const now=sod(new Date());
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  let start=calendarWeekStart(first);
  while(start<=last){
    const weekStart=new Date(start);
    const img=getWeekImage(weekStart);
    const isCurrent=now>=weekStart&&now<=addDays(weekStart,6);
    tile([formatWeekRange(weekStart),`W /// ${calendarWeekIndex(weekStart)}`],clsForDate(weekStart,img),()=>render("weekDays",{start:weekStart}),isCurrent?"currentTile":null,img);
    start=addDays(start,7);
  }
  scrollToCurrent();
}

function renderWeeks(){
  setState("Continuous Week Grid",`W /// 1 — W /// ${totalWeeks()}`,4);
  const now=sod(new Date());
  let start=calendarWeekStart(BIRTH);
  while(start<END){
    const weekStart=new Date(start);
    const img=getWeekImage(weekStart);
    const isCurrent=now>=weekStart&&now<=addDays(weekStart,6);
    tile([formatWeekRange(weekStart),`W /// ${calendarWeekIndex(weekStart)}`],clsForDate(weekStart,img),()=>render("weekDays",{start:weekStart}),isCurrent?"currentTile":null,img);
    start=addDays(start,7);
  }
  scrollToCurrent();
}

function renderWeekDays(start){
  const weekStart=calendarWeekStart(start);
  setState("Week Grid",formatWeekRange(weekStart),7);
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i);
    const img=getImageUrl(d);
    tile([formatMonthDay(d),`D /// ${dayNum(d)}`],clsForDate(d,img),()=>openDay(d),+sod(d)===+sod(new Date())?"currentTile":null,img,d);
  }
  scrollToCurrent();
}

function renderDays(){
  setState("Daily Grid","CURRENT WINDOW",7);
  const today=sod(new Date());
  const windowStart=addDays(today,-180);
  const start=calendarWeekStart(windowStart);
  const end=addDays(calendarWeekStart(addDays(today,365)),7);

  let d=clampDate(start);
  while(d<end&&d<END){
    const cur=new Date(d);
    const img=getImageUrl(cur);
    tile([formatMonthDay(cur),`D /// ${dayNum(cur)}`],clsForDate(cur,img),()=>openDay(cur),+sod(cur)===+today?"currentTile":null,img,cur);
    d=addDays(d,1);
  }
  scrollToCurrent();
}

function openDay(d){
  selectedDay=sod(d);
  selectedFile=null;
  photoPicker.value="";
  photoName.innerText="NO PHOTO SELECTED";
  activityName.value="";
  activityMinutes.value="";
  activityCategory.value="work";
  panelTitle.innerText=`${formatMonthDay(selectedDay)} / D /// ${dayNum(selectedDay)}`;
  panelMeta.innerHTML=`W /// ${calendarWeekIndex(selectedDay)}<br>LW /// ${lifeWeekNum(selectedDay)}<br>M /// ${monthNum(selectedDay.getFullYear(),selectedDay.getMonth())}<br>Y /// ${yearNum(selectedDay.getFullYear())}`;
  dayNote.value=localStorage.getItem(dayKey(selectedDay)+"_note")||"";
  sleepHours.value=localStorage.getItem(dayKey(selectedDay)+"_sleep_hours")||"";
  sleepMinutes.value=localStorage.getItem(dayKey(selectedDay)+"_sleep_minutes")||"";
  sleepScore.value=localStorage.getItem(dayKey(selectedDay)+"_sleep_score")||"";
  readinessScore.value=localStorage.getItem(dayKey(selectedDay)+"_readiness_score")||"";
  motivationScore.value=localStorage.getItem(dayKey(selectedDay)+"_motivation_score")||"";
  renderActivityList();
  renderTotals();
  dayPanel.classList.add("active");
}

dayNote.addEventListener("input",()=>{
  if(selectedDay)localStorage.setItem(dayKey(selectedDay)+"_note",dayNote.value);
});

function saveSleepMetric(){
  if(!selectedDay)return;
  localStorage.setItem(dayKey(selectedDay)+"_sleep_hours",sleepHours.value);
  localStorage.setItem(dayKey(selectedDay)+"_sleep_minutes",sleepMinutes.value);
  localStorage.setItem(dayKey(selectedDay)+"_sleep_score",sleepScore.value);
  renderTotals();
}

sleepHours.addEventListener("input",saveSleepMetric);
sleepMinutes.addEventListener("input",saveSleepMetric);
sleepScore.addEventListener("input",saveSleepMetric);

function saveStateMetrics(){
  if(!selectedDay)return;
  localStorage.setItem(dayKey(selectedDay)+"_readiness_score",readinessScore.value);
  localStorage.setItem(dayKey(selectedDay)+"_motivation_score",motivationScore.value);
}

readinessScore.addEventListener("input",saveStateMetrics);
motivationScore.addEventListener("input",saveStateMetrics);

function getActivitiesForDate(d){
  try{
    return JSON.parse(localStorage.getItem(activitiesKey(d))||"[]");
  }catch(e){
    return [];
  }
}

function getSleepMinutesForDate(d){
  const h=parseInt(localStorage.getItem(dayKey(d)+"_sleep_hours"),10)||0;
  const m=parseInt(localStorage.getItem(dayKey(d)+"_sleep_minutes"),10)||0;
  return (h*60)+m;
}

function calculateTotalsForDate(d){
  const totals={
    sleep:getSleepMinutesForDate(d),
    health:0,
    life:0,
    work:0
  };

  getActivitiesForDate(d).forEach(activity=>{
    const minutes=parseInt(activity.minutes,10)||0;
    if(activity.category==="health")totals.health+=minutes;
    if(activity.category==="life")totals.life+=minutes;
    if(activity.category==="work")totals.work+=minutes;
  });

  totals.tracked=totals.sleep+totals.health+totals.life+totals.work;
  return totals;
}

function hasDayMetricData(d){
  const totals=calculateTotalsForDate(d);
  return totals.tracked>0;
}

function percentOfDay(minutes){
  if(!minutes)return "-";
  return String(Math.round((minutes/DAY_MINUTES)*100));
}

function sleepDecimalForDate(d){
  const mins=getSleepMinutesForDate(d);
  if(!mins)return "";
  const value=mins/60;
  return Number.isInteger(value)?String(value):value.toFixed(1);
}

function getSleepScoreForDate(d){
  return localStorage.getItem(dayKey(d)+"_sleep_score")||"";
}

function getReadinessScoreForDate(d){
  return localStorage.getItem(dayKey(d)+"_readiness_score")||"";
}

function getMotivationScoreForDate(d){
  return localStorage.getItem(dayKey(d)+"_motivation_score")||"";
}

function scoreValue(value){
  return value?value:"-";
}

function tileMetricsHtml(d){
  if(!hasDayMetricData(d))return "";

  const totals=calculateTotalsForDate(d);
  const sleepDec=sleepDecimalForDate(d);
  const readiness=getReadinessScoreForDate(d);
  const motivation=getMotivationScoreForDate(d);

    return `
    <div class="tile-metrics">
      <div class="metric-grid">
        <div class="metric-square state-square">${scoreValue(sleepDec)}</div>
        <div class="metric-square state-square">${scoreValue(readiness)}</div>
        <div class="metric-square state-square">${scoreValue(motivation)}</div>
        <div class="metric-square state-square state-empty">-</div>
      </div>
      <div class="metric-grid">
        <div class="metric-square metric-sleep">${percentOfDay(totals.sleep)}</div>
        <div class="metric-square metric-health">${percentOfDay(totals.health)}</div>
        <div class="metric-square metric-life">${percentOfDay(totals.life)}</div>
        <div class="metric-square metric-work">${percentOfDay(totals.work)}</div>
      </div>
    </div>
  `;
}

function getActivities(){
  if(!selectedDay)return [];
  try{
    return JSON.parse(localStorage.getItem(activitiesKey(selectedDay))||"[]");
  }catch(e){
    return [];
  }
}

function saveActivities(activities){
  if(!selectedDay)return;
  localStorage.setItem(activitiesKey(selectedDay),JSON.stringify(activities));
}

function formatActivityCategory(category){
  if(category==="work")return "WORK";
  if(category==="life")return "LIFE";
  if(category==="health")return "HEALTH";
  return "UNKNOWN";
}

function renderActivityList(){
  if(!selectedDay)return;
  const activities=getActivities();
  activityList.innerHTML="";

  if(!activities.length){
    const empty=document.createElement("div");
    empty.className="activity-meta";
    empty.innerText="NO ACTIVITIES LOGGED";
    activityList.appendChild(empty);
    return;
  }

  activities.forEach(activity=>{
    const item=document.createElement("div");
    item.className="activity-item";
    item.innerHTML=`
      <div class="activity-name">${activity.name}</div>
      <div class="activity-meta">${formatActivityCategory(activity.category)} / ${activity.minutes}M</div>
      <button class="activity-delete" onclick="deleteActivity('${activity.id}')">X</button>
    `;
    activityList.appendChild(item);
  });
}

function addActivity(){
  if(!selectedDay)return;

  const name=activityName.value.trim();
  const minutes=parseInt(activityMinutes.value,10);
  const category=activityCategory.value;

  if(!name){alert("ENTER ACTIVITY NAME");return}
  if(!minutes||minutes<1){alert("ENTER MINUTES");return}

  const activities=getActivities();
  activities.push({
    id:String(Date.now()),
    name,
    minutes,
    category
  });

  saveActivities(activities);

  activityName.value="";
  activityMinutes.value="";
  activityCategory.value="work";

  renderActivityList();
  renderTotals();
}

function deleteActivity(id){
  if(!selectedDay)return;
  const activities=getActivities().filter(activity=>activity.id!==id);
  saveActivities(activities);
  renderActivityList();
  renderTotals();
}

function getSleepMinutes(){
  const h=parseInt(sleepHours.value,10)||0;
  const m=parseInt(sleepMinutes.value,10)||0;
  return (h*60)+m;
}

function calculateTotals(){
  const totals={
    sleep:getSleepMinutes(),
    health:0,
    life:0,
    work:0
  };

  getActivities().forEach(activity=>{
    const minutes=parseInt(activity.minutes,10)||0;
    if(activity.category==="health")totals.health+=minutes;
    if(activity.category==="life")totals.life+=minutes;
    if(activity.category==="work")totals.work+=minutes;
  });

  totals.tracked=totals.sleep+totals.health+totals.life+totals.work;
  totals.untracked=DAY_MINUTES-totals.tracked;
  totals.trackedPercent=Math.round((totals.tracked/DAY_MINUTES)*100);

  return totals;
}

function formatMinutes(total){
  const sign=total<0?"-":"";
  const n=Math.abs(total);
  const h=Math.floor(n/60);
  const m=n%60;
  if(h&&m)return `${sign}${h}H ${m}M`;
  if(h)return `${sign}${h}H`;
  return `${sign}${m}M`;
}

function addTotalBox(label,value){
  const box=document.createElement("div");
  box.className="total-box";
  box.innerHTML=`<div class="total-label">${label}</div><div class="total-value">${value}</div>`;
  totalsGrid.appendChild(box);
}

function renderTotals(){
  if(!selectedDay)return;
  const totals=calculateTotals();
  totalsGrid.innerHTML="";

  addTotalBox("Sleep",formatMinutes(totals.sleep));
  addTotalBox("Health",formatMinutes(totals.health));
  addTotalBox("Life",formatMinutes(totals.life));
  addTotalBox("Work",formatMinutes(totals.work));
  addTotalBox("Tracked",`${totals.trackedPercent}%`);
  addTotalBox(totals.untracked>=0?"Untracked":"Over",formatMinutes(totals.untracked));
}

function choosePhoto(){photoPicker.click()}

photoPicker.addEventListener("change",()=>{
  selectedFile=photoPicker.files[0];
  photoName.innerText=selectedFile?selectedFile.name:"NO PHOTO SELECTED";
});

async function uploadPhoto(){
  if(!selectedDay){alert("NO DAY SELECTED");return}
  if(!selectedFile){alert("SELECT PHOTO FIRST");return}

  const oldUrl=getImageUrl(selectedDay);
  const fileName=uniqueImageFileName(selectedDay,selectedFile);
  let result=await attemptPhotoUpload(fileName,selectedFile,false);

  if(result.status===401){
    localStorage.removeItem(UPLOAD_KEY_STORAGE);
    result=await attemptPhotoUpload(fileName,selectedFile,true);
  }

  if(!result.ok){alert("UPLOAD FAILED");return}

  localStorage.setItem(dayKey(selectedDay)+"_image",result.url);

  if(oldUrl&&oldUrl!==result.url){
    await deleteR2ImageByUrl(oldUrl);
  }

  dayPanel.classList.remove("active");
  render(currentRender.mode,currentRender.data,false);
}

async function clearImageUrl(){
  if(!selectedDay)return;

  const oldUrl=getImageUrl(selectedDay);
  localStorage.removeItem(dayKey(selectedDay)+"_image");

  if(oldUrl){
    const deleted=await deleteR2ImageByUrl(oldUrl);
    if(!deleted)alert("IMAGE REMOVED LOCALLY. CLOUD DELETE FAILED.");
  }

  dayPanel.classList.remove("active");
  render(currentRender.mode,currentRender.data,false);
}

function closePanel(refresh=false){
  dayPanel.classList.remove("active");
  if(refresh)render(currentRender.mode,currentRender.data,false);
}

function northStarStorageSnapshot(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key&&key.startsWith("ns_day_")){
      data[key]=localStorage.getItem(key);
    }
    if(key===UPLOAD_KEY_STORAGE){
      data[key]=localStorage.getItem(key);
    }
  }
  return data;
}

function exportSave(){
  const now=new Date();
  const stamp=now.toISOString().slice(0,10);
  const save={
    app:"North Star",
    version:APP_VERSION,
    exportedAt:now.toISOString(),
    localStorage:northStarStorageSnapshot()
  };

  const blob=new Blob([JSON.stringify(save,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=`north-star-save-v${APP_VERSION}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function importSave(){
  saveImporter.click();
}

saveImporter.addEventListener("change",()=>{
  const file=saveImporter.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const save=JSON.parse(reader.result);

      if(!save||save.app!=="North Star"||!save.localStorage){
        alert("INVALID NORTH STAR SAVE FILE");
        return;
      }

      Object.keys(save.localStorage).forEach(key=>{
        if(key.startsWith("ns_day_")||key===UPLOAD_KEY_STORAGE){
          localStorage.setItem(key,save.localStorage[key]);
        }
      });

      alert("SAVE LOADED");
      render(currentRender.mode,currentRender.data,false);
    }catch(e){
      alert("SAVE IMPORT FAILED");
    }

    saveImporter.value="";
  };

  reader.readAsText(file);
});

function goBack(){
  const last=historyStack.pop();
  if(!last){render("days",null,false);return}
  render(last.mode,last.data,false);
}

meta();
render("days",null,false);
</script>
