<!DOCTYPE html>
<html>
<head>
  <title>North Star</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="North Star">
  <meta name="theme-color" content="#050505">

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      width:100vw;
      height:100vh;
      background:#050505;
      color:#f2f2f2;
      font-family:Arial, Helvetica, sans-serif;
      overflow:hidden;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .topbar{
      height:42px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      letter-spacing:.5px;
      font-weight:800;
    }

    .brand{
      font-size:16px;
      text-transform:lowercase;
      opacity:.95;
    }

    .meta{
      font-size:12px;
      opacity:.8;
      text-align:right;
      line-height:1.4;
    }

    .nav{
      display:flex;
      gap:10px;
      align-items:center;
      height:34px;
    }

    button{
      background:transparent;
      color:#f2f2f2;
      border:1px solid rgba(255,255,255,.65);
      padding:7px 13px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .label{
      font-size:12px;
      font-weight:800;
      letter-spacing:1px;
      opacity:.75;
      text-transform:uppercase;
    }

    .grid-wrap{
      flex:1;
      overflow:auto;
      border:1px solid rgba(255,255,255,.22);
      background:#111;
      position:relative;
    }

    .grid{
      display:grid;
      min-height:100%;
      position:relative;
    }

    .tile{
      position:relative;
      min-height:116px;
      border-right:2px solid rgba(255,255,255,.55);
      border-bottom:2px solid rgba(255,255,255,.55);
      background:#1a1d22;
      padding:12px;
      cursor:pointer;
      overflow:hidden;
    }

    .tile:nth-child(even){
      background:#171a1f;
    }

    .tile.current{
      outline:4px solid #f2f2f2;
      outline-offset:-4px;
      background:#20242b;
    }

    .tile:hover{
      background:#242832;
    }

    .tile::after{
      content:"+";
      position:absolute;
      right:-8px;
      bottom:-12px;
      color:#f2f2f2;
      font-size:26px;
      font-weight:300;
      z-index:3;
      opacity:.9;
    }

    .tile-title{
      font-size:24px;
      font-weight:900;
      line-height:.95;
      letter-spacing:.5px;
      text-transform:uppercase;
    }

    .tile-sub{
      margin-top:4px;
      font-size:13px;
      font-weight:800;
      opacity:.78;
      text-transform:uppercase;
    }

    .tile-small{
      position:absolute;
      left:12px;
      bottom:10px;
      font-size:12px;
      font-weight:800;
      opacity:.7;
      text-transform:uppercase;
    }

    .future{
      opacity:.38;
    }

    .past{
      opacity:.82;
    }

    .day-tile{
      min-height:104px;
    }

    .empty{
      background:#0e0f12;
      opacity:.3;
      cursor:default;
    }

    .empty::after{
      content:"";
    }

    .view-title{
      font-size:14px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      opacity:.9;
    }
  </style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="brand">north star</div>
      <div class="label" id="viewLabel">Lifetime Grid</div>
    </div>
    <div class="meta" id="lifeMeta"></div>
  </div>

  <div class="nav">
    <button onclick="showLifetime()">Lifetime</button>
    <button onclick="goBack()">Back</button>
    <div class="view-title" id="currentView"></div>
  </div>

  <div class="grid-wrap">
    <div id="grid" class="grid"></div>
  </div>

</div>

<script>
const BIRTH = new Date(1987, 5, 26);
const HORIZON_YEARS = 110;
const END_YEAR = BIRTH.getFullYear() + HORIZON_YEARS;
const MS_DAY = 1000 * 60 * 60 * 24;

let viewStack = [];
let currentMode = "lifetime";
let selectedYear = null;
let selectedMonth = null;

function startOfDay(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function dayNumber(date){
  return Math.floor((startOfDay(date) - startOfDay(BIRTH)) / MS_DAY) + 1;
}

function ageYears(date=new Date()){
  return (date - BIRTH) / (MS_DAY * 365.2425);
}

function updateMeta(){
  const now = new Date();
  const daysAlive = dayNumber(now);
  const totalDays = Math.floor(365.2425 * HORIZON_YEARS);
  const percent = ((daysAlive / totalDays) * 100).toFixed(2);

  document.getElementById("lifeMeta").innerHTML =
    `DAY ${daysAlive.toLocaleString()}<br>AGE ${ageYears(now).toFixed(2)}<br>${percent}% TO 110`;
}

function setGridColumns(count){
  document.getElementById("grid").style.gridTemplateColumns = `repeat(${count}, 1fr)`;
}

function clearGrid(){
  document.getElementById("grid").innerHTML = "";
}

function makeTile({title, sub, small, className="", onClick=null}){
  const tile = document.createElement("div");
  tile.className = "tile " + className;
  tile.innerHTML = `
    <div class="tile-title">${title}</div>
    <div class="tile-sub">${sub || ""}</div>
    <div class="tile-small">${small || ""}</div>
  `;
  if(onClick) tile.onclick = onClick;
  return tile;
}

function showLifetime(){
  currentMode = "lifetime";
  selectedYear = null;
  selectedMonth = null;
  viewStack = [];
  clearGrid();
  setGridColumns(8);

  document.getElementById("viewLabel").innerText = "Lifetime Grid";
  document.getElementById("currentView").innerText = `${BIRTH.getFullYear()} — ${END_YEAR}`;

  const now = new Date();
  const currentYear = now.getFullYear();

  for(let y = BIRTH.getFullYear(); y <= END_YEAR; y++){
    const yearOfLife = y - BIRTH.getFullYear() + 1;
    let cls = "";
    if(y < currentYear) cls = "past";
    if(y > currentYear) cls = "future";
    if(y === currentYear) cls = "current";

    const tile = makeTile({
      title:y,
      sub:`Y /// ${yearOfLife}`,
      small: y === currentYear ? "CURRENT YEAR" : "",
      className:cls,
      onClick:()=>showYear(y)
    });

    document.getElementById("grid").appendChild(tile);
  }
}

function showYear(year){
  viewStack.push({mode:currentMode, year:selectedYear, month:selectedMonth});
  currentMode = "year";
  selectedYear = year;
  selectedMonth = null;
  clearGrid();
  setGridColumns(4);

  document.getElementById("viewLabel").innerText = "Year Grid";
  document.getElementById("currentView").innerText = `${year} / Y /// ${year - BIRTH.getFullYear() + 1}`;

  const now = new Date();
  const monthNames = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  for(let m=0;m<12;m++){
    const first = new Date(year, m, 1);
    const monthOfLife = (year - BIRTH.getFullYear()) * 12 + m + 1;
    let cls = "";
    if(year < now.getFullYear() || (year === now.getFullYear() && m < now.getMonth())) cls = "past";
    if(year > now.getFullYear() || (year === now.getFullYear() && m > now.getMonth())) cls = "future";
    if(year === now.getFullYear() && m === now.getMonth()) cls = "current";

    const tile = makeTile({
      title:monthNames[m],
      sub:`M /// ${monthOfLife}`,
      small:`DAY ${dayNumber(first).toLocaleString()}`,
      className:cls,
      onClick:()=>showMonth(year,m)
    });

    document.getElementById("grid").appendChild(tile);
  }
}

function showMonth(year, month){
  viewStack.push({mode:currentMode, year:selectedYear, month:selectedMonth});
  currentMode = "month";
  selectedYear = year;
  selectedMonth = month;
  clearGrid();
  setGridColumns(7);

  const monthNames = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  document.getElementById("viewLabel").innerText = "Month Grid";
  document.getElementById("currentView").innerText = `${monthNames[month]} ${year}`;

  const now = new Date();
  const first = new Date(year, month, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for(let i=0;i<startDay;i++){
    const empty = document.createElement("div");
    empty.className = "tile empty";
    document.getElementById("grid").appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(year, month, d);
    let cls = "day-tile";
    if(date < startOfDay(now)) cls += " past";
    if(date > startOfDay(now)) cls += " future";
    if(date.getFullYear()===now.getFullYear() && date.getMonth()===now.getMonth() && date.getDate()===now.getDate()) cls += " current";

    const tile = makeTile({
      title:d,
      sub:`D /// ${dayNumber(date).toLocaleString()}`,
      small: date.toLocaleDateString(undefined,{weekday:"short"}).toUpperCase(),
      className:cls,
      onClick:()=>alert(`${date.toDateString()}\nDay ${dayNumber(date).toLocaleString()}`)
    });

    document.getElementById("grid").appendChild(tile);
  }
}

function goBack(){
  const last = viewStack.pop();
  if(!last){
    showLifetime();
    return;
  }

  if(last.mode === "lifetime") showLifetime();
  if(last.mode === "year") showYear(last.year);
  if(last.mode === "month") showMonth(last.year,last.month);
}

updateMeta();
showLifetime();
</script>
</body>
</html>
